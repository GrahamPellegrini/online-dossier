<h2 class="h1l">A policy learns a movement from human demonstrations</h2>
<img class="lockimg" src="assets/policy_correct.png" alt="Two-part padlock and key: the policy puts the key in and turns it"/>
<p class="quote">&ldquo;I see a lock and a key: put the key in the lock and turn it.&rdquo;</p>
<p class="under"><b>Policy:</b> watches the scene and outputs the next hand movements. <b>Action:</b> the next small movement of each wrist, where it goes and which way it turns.</p>
