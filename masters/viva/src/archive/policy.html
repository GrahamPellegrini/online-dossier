<h2 class="h1l">What is a policy?</h2>
<p class="lead" style="margin-top:8px!important;max-width:none;font-size:1.3rem">A policy is a model that learns from demonstrations (human, robot or simulated) to turn the current scene into a chunk of future actions.</p>
